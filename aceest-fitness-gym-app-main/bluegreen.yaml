# Blue-Green Deployment Example
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-gym-blue
  labels:
    app: aceest-fitness-gym
    version: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-gym
      version: blue
  template:
    metadata:
      labels:
        app: aceest-fitness-gym
        version: blue
    spec:
      containers:
      - name: aceest-fitness-gym
        image: <DOCKER_HUB_USERNAME>/aceest-fitness-gym:blue
        ports:
        - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-gym-green
  labels:
    app: aceest-fitness-gym
    version: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-gym
      version: green
  template:
    metadata:
      labels:
        app: aceest-fitness-gym
        version: green
    spec:
      containers:
      - name: aceest-fitness-gym
        image: <DOCKER_HUB_USERNAME>/aceest-fitness-gym:green
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-gym-bluegreen-service
spec:
  selector:
    app: aceest-fitness-gym
    version: blue # Switch to green for cutover
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer

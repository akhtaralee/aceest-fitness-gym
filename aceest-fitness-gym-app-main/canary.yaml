# Canary Deployment Example
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-gym-canary
  labels:
    app: aceest-fitness-gym
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-gym
      track: canary
  template:
    metadata:
      labels:
        app: aceest-fitness-gym
        track: canary
    spec:
      containers:
      - name: aceest-fitness-gym
        image: <DOCKER_HUB_USERNAME>/aceest-fitness-gym:canary
        ports:
        - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-gym-stable
  labels:
    app: aceest-fitness-gym
    track: stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness-gym
      track: stable
  template:
    metadata:
      labels:
        app: aceest-fitness-gym
        track: stable
    spec:
      containers:
      - name: aceest-fitness-gym
        image: <DOCKER_HUB_USERNAME>/aceest-fitness-gym:stable
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-gym-canary-service
spec:
  selector:
    app: aceest-fitness-gym
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer

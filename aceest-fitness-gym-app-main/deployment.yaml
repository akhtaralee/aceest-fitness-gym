# aceest-fitness-gym-app Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-gym-deployment
  labels:
    app: aceest-fitness-gym
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness-gym
  template:
    metadata:
      labels:
        app: aceest-fitness-gym
    spec:
      containers:
      - name: aceest-fitness-gym
        image: <DOCKER_HUB_USERNAME>/aceest-fitness-gym:latest
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20

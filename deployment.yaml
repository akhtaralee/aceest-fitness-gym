apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness-app
  template:
    metadata:
      labels:
        app: aceest-fitness-app
    spec:
      containers:
      - name: aceest-fitness-app
        image: docker.io/aleenaakhtar/aceest-fitness-app:latest
        ports:
        - containerPort: 8080
